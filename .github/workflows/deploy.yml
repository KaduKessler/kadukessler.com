name: Build and Deploy
permissions:
  contents: read

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run Biome CI check
      run: pnpm exec biome ci --reporter=github .

    - name: Build
      run: pnpm build
      env:
        VITE_BLOG_ENABLED: ${{ vars.BLOG_ENABLED }}

    - name: Sync to server
      uses: burnett01/rsync-deployments@v8
      with:
        switches: -avz --delete
        path: dist/
        remote_path: ${{ secrets.REMOTE_DIR }}
        remote_host: ${{ secrets.SSH_HOST }}
        remote_user: ${{ secrets.SSH_USER }}
        remote_port: ${{ secrets.SSH_PORT }}
        remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: PM2 Restart
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        port: ${{ secrets.SSH_PORT }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -eu
          export PATH=$PATH:/usr/local/bin
          cd ${{ secrets.REMOTE_DIR }}

          node --check .server/server.mjs

          if pm2 describe "${{ secrets.PM2_NAME }}" >/dev/null 2>&1; then
            pm2 delete "${{ secrets.PM2_NAME }}"
          fi

          PORT="${{ secrets.PORT }}" pm2 start .server/server.mjs \
            --name "${{ secrets.PM2_NAME }}" \
            --interpreter node

          node .server/verify-server.mjs . "http://127.0.0.1:${{ secrets.PORT }}"

          pm2 save
          pm2 describe "${{ secrets.PM2_NAME }}"
